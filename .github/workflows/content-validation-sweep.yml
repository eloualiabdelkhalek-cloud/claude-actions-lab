name: Content Validation Sweep

on:
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Content Validation
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Sweep repo content (docs, README, config samples) for factual
            inconsistencies, broken code examples, or outdated version numbers.
            Open a PR with corrections if any are found.
          claude_args: "--allowed-tools Read,Edit,Grep,Glob"
