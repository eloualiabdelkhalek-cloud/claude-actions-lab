name: CI-Failure Repair Loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Claude Code Repair
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" failed on
            branch ${{ github.event.workflow_run.head_branch }}.
            Diagnose the failure from logs, fix the root cause, run the test
            suite locally to confirm, then commit the fix.
            Stop after at most 15 turns — if unresolved, leave a summary
            comment on the associated PR instead of committing a partial fix.
          claude_args: "--max-turns 15 --allowed-tools Read,Edit,Bash,Grep,Glob"
