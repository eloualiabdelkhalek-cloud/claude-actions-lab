name: CI-Failure Repair Loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Create repair branch
        run: git checkout -b ci-repair/${{ github.event.workflow_run.id }}

      - name: Run Claude to diagnose and fix CI failure
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: |
            The "CI" workflow failed on run ${{ github.event.workflow_run.id }}.
            Download the failing job logs, reproduce the failure locally,
            and apply the minimal fix needed to make CI pass again.
            Do not change unrelated code.
          claude_args: "--max-turns 15"

      - name: Push repair branch
        run: |
          git config user.name "claude-ci-repair-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: automated CI repair for run ${{ github.event.workflow_run.id }}"
          git push origin HEAD
